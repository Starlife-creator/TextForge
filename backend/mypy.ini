[mypy]
python_version = 3.13
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
# Legacy modules are mostly unannotated: check annotated bodies only for now.
# New modules (core/blueprint.py, core/quality.py) must stay fully annotated.
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true
no_implicit_optional = true
warn_unreachable = false
# Test scripts are in-process assertion scripts, not product modules.
exclude = ^(venv|build|dist)/|^(tests/|mock_llm\.py$|regression_test\.py$|test_e2e_pipeline\.py$|test_event_stream\.py$|smoke_uvicorn_socket\.py$)

[mypy-fastapi.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-httpx.*]
ignore_missing_imports = true

[mypy-uvicorn.*]
ignore_missing_imports = true

[mypy-docx.*]
ignore_missing_imports = true

[mypy-chardet.*]
ignore_missing_imports = true

[mypy-cn2an.*]
ignore_missing_imports = true

[mypy-routes.*]
ignore_missing_imports = true

[mypy-core.*]
ignore_missing_imports = true

[mypy-utils.*]
ignore_missing_imports = true
