[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unused_imports = true
strict_equality = true
no_implicit_optional = true
warn_unreachable = true

[tool.mypy.fastapi.*]
ignore_missing_imports = true

[tool.mypy.pydantic.*]
ignore_missing_imports = true

[tool.mypy.httpx.*]
ignore_missing_imports = true

[tool.mypy.uvicorn.*]
ignore_missing_imports = true

[tool.mypy.httpx.*]
ignore_missing_imports = true

[tool.mypy.python_docx.*]
ignore_missing_imports = true

[tool.mypy.chardet.*]
ignore_missing_imports = true

[tool.mypy.cn2an.*]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "routes.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "core.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "utils.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "test_*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "regression_test"
ignore_missing_imports = true