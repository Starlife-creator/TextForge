[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# 只保留能抓真实缺陷的规则：语法错误、pyflakes（未定义/未使用）、bugbear。
# 既有代码大量使用单行多语句、且在 setup_logging 之后才导入路由，
# 风格类规则（E4/E7/I/UP）一开就会在历史代码上永久变红，失去信号价值。
select = ["E9", "F", "B"]
ignore = [
    "B008",  # FastAPI 依赖注入的默认参数
    "B904",  # 旧代码的 raise ... from 风格，单独治理
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
