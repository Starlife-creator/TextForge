name: build-check

# 质量门：代码改动即验证能否编译与通过测试，不发布安装包。
# 触发：推送 main、创建/更新 PR。避免等到打 tag 发版才发现问题。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一分支/PR 的新推送取消仍在跑的旧任务：否则连推几次会同时占满多台
# Windows runner（分钟数按并发计费），且旧结果毫无价值。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

# 拆成三个并行 job。此前所有检查串行跑在一个 job 里，墙钟时间等于各步之和；
# 而它们之间几乎没有依赖（端到端只需要 Python 后端，不需要 Node/Rust）。
# 并行后墙钟 ≈ 最慢的一项，失败时也能立刻看出是哪一类出问题。
jobs:
  # ---------------------------------------------------------------- 静态检查
  static:
    name: 静态检查（前端 + Rust）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node（前端）
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 只装依赖：类型检查交给下面 `npm run build`（其脚本本就是
      # `vue-tsc --noEmit && vite build`），避免 vue-tsc 跑两遍。
      - name: 安装前端依赖
        run: npm ci

      # vue-tsc 只能证明「能编译」，证明不了「行为对」。后端 release 下要求每个
      # 请求都带 X-TextForge-Token，而 apiFetch 是全部调用点的唯一中转站 ——
      # 漏注入的后果是所有接口 401，表现却只是界面空白。
      - name: 前端单元测试
        run: npm run test

      # ESLint 管代码质量、Prettier 管排版；两者在 CI 各自阻断，避免风格分歧
      # 在本地被忽略、累积成大范围重排的 diff。
      - name: 前端 Lint（ESLint）
        run: npm run lint

      - name: 前端格式检查（Prettier）
        run: npm run format:check

      - name: 前端构建
        run: npm run build

      # tauri-build 的构建脚本会校验 externalBin 指向的文件**存在**（供打包配置解析），
      # 找不到就直接失败。此前这个 job 靠「先真构建一遍 sidecar」顺带满足它，
      # 但 cargo check / cargo test 根本不会执行那个 exe —— 放个占位文件即可，
      # 省掉整条 PyInstaller 构建链。
      - name: 占位 sidecar（仅满足 tauri-build 的存在性校验）
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          printf 'placeholder for cargo check/test' > src-tauri/binaries/backend-x86_64-pc-windows-msvc.exe

      # Rust 侧的进程生命周期逻辑此前完全无测试覆盖，而这里正是最容易出错的
      # 一层（孤儿进程、端口发现、数据目录解析）。
      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ------------------------------------------------------------ 后端单元/回归/代码质量
  backend-unit:
    name: 后端单测 / 回归 / 事件流 / 代码质量
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 准备虚拟环境
        shell: bash
        run: |
          cd backend
          python -m venv venv
          source venv/Scripts/activate
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 后端 Lint (ruff)
        shell: bash
        run: |
          cd backend
          source venv/Scripts/activate
          ruff check .

      - name: 后端类型检查 (mypy)
        shell: bash
        run: |
          cd backend
          source venv/Scripts/activate
          mypy --config-file mypy.ini .

      - name: pytest
        shell: bash
        run: |
          cd backend
          source venv/Scripts/activate
          python -m pytest tests -q

      # 脚本形态而非 pytest 收集：这两个文件在模块顶层执行并自行退出码。
      - name: 回归 / 事件流
        shell: bash
        run: |
          cd backend
          source venv/Scripts/activate
          python regression_test.py
          python test_event_stream.py

  # ------------------------------------------------------------------ 端到端
  e2e:
    name: 端到端（mock LLM 真跑 phase0→phase4）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 准备虚拟环境
        shell: bash
        run: |
          cd backend
          python -m venv venv
          source venv/Scripts/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # 端到端能抓到单元测试结构上抓不到的问题，例如 stitch.py 用了未导入的
      # sse_emit —— 那类 NameError 只有真正执行才会暴露。
      - name: 端到端测试
        shell: bash
        run: |
          cd backend
          source venv/Scripts/activate
          python test_e2e_pipeline.py

  # ------------------------------------------------------- 非 Windows 编译门
  # backend.rs 里的 `cfg(not(windows))` libc::kill 分支此前从未被任何 CI 编译过
  #（release 只出 Windows），Cargo.toml 注释也记录了它「曾经根本编译不过」。
  # 这里用 ubuntu 跑一次 cargo check，把这个分支重新纳入编译门。
  rust-nonwindows:
    name: Rust 编译（非 Windows）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential pkg-config

      - name: 占位 sidecar（仅满足 tauri-build 的存在性校验）
        run: |
          mkdir -p src-tauri/binaries
          printf 'placeholder for cargo check' > src-tauri/binaries/backend-x86_64-unknown-linux-gnu

      - name: Rust 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml
