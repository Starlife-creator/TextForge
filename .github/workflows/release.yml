name: release

# 触发：推送 v 开头的 tag（如 v0.5.0）自动构建并发布 GitHub Release
# 也可 Actions 页面手动运行（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限：上传便携包到 Release
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  # 发布前快检：此前 release 仅由 tag/dispatch 触发，从不跑测试或 lint ——
  # 一个没通过 build-check 的提交打了 tag 就能直接发布。这里补一道最便宜的门。
  test:
    name: 发布前测试门
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 单元测试
        run: npm run test

      - name: Lint
        run: npm run lint

  build-release:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 版本号硬编码在 package.json / src-tauri/Cargo.toml / src-tauri/tauri.conf.json
      # 三处。三者不一致、或与 tag 不一致时，会产出「文件名是旧版本、却挂在 v新版本
      # 这个 tag 下」的包，用户下载到的版本号全错，且很难撤回。
      - name: 校验三处版本号 + tag 一致性
        shell: pwsh
        run: |
          $pkg   = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path 'src-tauri\Cargo.toml' -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "package.json=$pkg  Cargo.toml=$cargo  tauri.conf.json=$tauri  ref=${{ github.ref }}"
          if ($pkg -ne $cargo -or $pkg -ne $tauri) {
            throw "三处版本号不一致：package=$pkg cargo=$cargo tauri=$tauri"
          }
          if ("${{ github.ref }}" -like 'refs/tags/v*' -and ("v$pkg" -ne "${{ github.ref_name }}")) {
            throw "tag ${{ github.ref_name }} 与版本 v$pkg 不一致（应打 v$pkg）"
          }

      - name: 安装 Node（前端）
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Python（sidecar 后端）
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Rust 依赖缓存。缺这一段时每次发布都要从零重编全部 crate，约 8 分半；
      # build-check 里有缓存而 release 里没有，属于纯浪费。
      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 前端依赖安装
        run: npm ci

      # 构建 sidecar。**必须用 --onedir**，理由有三：
      #   1. onefile 每次运行都把载荷解压到 %TEMP%\_MEIxxxxxx（实测约 40MB），
      #      启动要 2.5~2.8s；onedir 直接铺开，实测 0.65~0.69s。
      #   2. onefile 是父子双进程，child.kill() 只杀得掉引导进程，Python 子进程会
      #      变孤儿并残留 _MEI 目录；onedir 单进程，kill 直接生效。
      #   3. 「运行时自解压到临时目录」正是 Defender 把它误判为恶意软件的主要特征，
      #      去掉它同时也降低误报概率。
      #
      # Tauri 的 externalBin 要求单文件，故仍产出该占位文件供 tauri build 校验；
      # 真正的便携包在下一步由我们手工组装 —— onedir 的 exe 正是从
      # 「自身所在目录/_internal」找依赖，把两者铺平即可。
      # PyInstaller 的 flag 列表（--collect-all 等）集中在 backend\build_sidecar.bat：
      # 本地与 CI 共用同一入口，杜绝两处配置漂移后、只在冻结版运行期才炸 ImportError。
      - name: 准备后端虚拟环境
        shell: bash
        run: |
          cd backend
          python -m venv venv
          source venv/Scripts/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 构建 sidecar 后端（backend\build_sidecar.bat，onedir）
        shell: cmd
        run: call backend\build_sidecar.bat

      # bundle.active=false → 只出外壳二进制，不生成 NSIS/MSI 安装壳。
      # sidecar 不用 tauri 拷贝：它在下一步直接从 PyInstaller 的 onedir 产物组装。
      - name: 构建外壳（不生成安装包）
        run: npx tauri build --config src-tauri/tauri.portable.json --target x86_64-pc-windows-msvc

      - name: 组装便携目录并打包 zip
        shell: pwsh
        run: |
          $rel = 'src-tauri\target\x86_64-pc-windows-msvc\release'
          $od  = 'backend\build\dist\backend'    # build_sidecar.bat 的 PyInstaller onedir 产物
          $stage = 'TextForge'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel\textforge.exe" $stage
          # sidecar 必须是 backend.exe（运行时按 <exe同级>/backend.exe 定位），
          # 且 _internal 必须与它同级 —— onedir 的 exe 从自身目录找依赖。
          Copy-Item "$od\backend.exe" "$stage\backend.exe"
          Copy-Item "$od\_internal" $stage -Recurse
          Copy-Item 'docs\使用说明.txt' $stage
          $ver = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $zip = "TextForge_${ver}_portable_x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "生成 $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: 上传便携包到 Release
        shell: pwsh
        # gh CLI 不会自动读取 Actions 内置凭据，缺 GH_TOKEN 会直接报
        # "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
        # environment variable" 并 exit 1。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          # 用单引号 here-string：正文里有 markdown 反引号，在双引号 here-string
          # 里会被 PowerShell 当成转义符吃掉。版本号靠 -replace 事后替换。
          $notes = @'
          文炼工坊 TextForge __VER__ —— **免安装便携版**

          - 下载 `TextForge___VER___portable_x64.zip`，**解压**后双击 `textforge.exe`
          - 不需要安装、不需要管理员权限、不写注册表
          - 整个文件夹可随意搬移；删除文件夹即彻底卸载，不留残余
          - 用 SHA256SUMS.txt 校验下载完整性：`certutil -hashfile 文件名 SHA256`

          ## 为什么改用便携版
          之前的 NSIS 安装包会被 Windows Defender 误报拦截
          （`Trojan:Win32/Wacatac.B!ml`；末尾 `!ml` 表示机器学习泛化判定，不是病毒特征码）。
          实测把 PyInstaller 后端单独拿出来扫描是干净的，元凶是安装壳把这份
          高熵载荷又包了一层。便携版彻底去掉了安装壳。

          ## 关于「删掉文件夹是否等于没装过」
          实测：注册表、AppData、LocalAppData 均无新增项；历史/日志/端口文件
          全部落在包内 `data\` 子目录。唯一例外是运行期间 `%TEMP%` 下的
          `_MEIxxxxxx`（Python 自解压缓存，约 40MB），**正常关窗即自动删除**；
          仅在进程被强杀或系统断电时才会残留，Windows 会自行清理临时目录。

          ## 仍可能提示未知发布者
          本项目未购买商业代码签名证书，因此没有数字签名。
          若 Defender 仍误报，请在「病毒和威胁防护 → 保护历史记录」中恢复，
          并把解压后的文件夹加入排除项。

          ## 小说成品在哪
          不在本文件夹里 —— 成品路径由你在界面中自行选择。
          '@
          $notes = $notes -replace '__VER__', $ver
          $notes | Out-File -Encoding utf8 RELEASE_NOTES.md

          # workflow_dispatch 时 github.ref_name 是分支名（如 main），不能当 tag 用。
          # tag 推送时 ref_name 本来就是 v$ver，统一取 v$ver 两种情况都对；
          # dispatch 时该 tag 尚不存在，显式 --target 到当前提交。
          $tag = "v$ver"
          $args = @($tag, "TextForge_${ver}_portable_x64.zip", "SHA256SUMS.txt",
                    "--title", "TextForge $ver（免安装便携版）",
                    "--notes-file", "RELEASE_NOTES.md",
                    "--repo", "${{ github.repository }}")
          if ("${{ github.ref }}" -notlike 'refs/tags/*') { $args += @("--target", "${{ github.sha }}") }
          gh release create @args
