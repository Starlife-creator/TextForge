name: release

# 触发：推送 v 开头的 tag（如 v0.5.0）自动构建并发布 GitHub Release
# 也可 Actions 页面手动运行（workflow_dispatch）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 需要写权限：上传便携包到 Release
permissions:
  contents: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.13'

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node（前端）
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 安装 Python（sidecar 后端）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Rust 依赖缓存。缺这一段时每次发布都要从零重编全部 crate，约 8 分半；
      # build-check 里有缓存而 release 里没有，属于纯浪费。
      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 前端依赖安装
        run: npm ci

      # 构建 sidecar（PyInstaller onefile exe）。
      # 参数与 backend/build_sidecar.bat 保持一致（均已移除已精简的 natsort/PyYAML）。
      #
      # 注意：此前发布的是 NSIS 安装包，被 Defender 以 Trojan:Win32/Wacatac.B!ml
      # 误报拦截（`!ml` = 机器学习泛化判定，非病毒特征码）。实测把 sidecar
      # 单独拿出来扫是干净的，元凶是 NSIS 安装壳把 25MB 高熵载荷再包一层。
      # 因此改为发布**免安装便携 zip**：无安装壳、无注册表、无 Program Files 写入。
      - name: 构建 sidecar 后端
        shell: bash
        run: |
          cd backend
          python -m venv venv
          source venv/Scripts/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          python -m PyInstaller --noconsole --onefile \
            --collect-all fastapi --collect-all starlette --collect-all pydantic \
            --collect-all pydantic_core --collect-all uvicorn --collect-all anyio \
            --collect-all httpx --collect-all h11 --collect-all sniffio \
            --collect-all chardet --collect-all charset_normalizer \
            --collect-all socksio --collect-all lxml --collect-all docx \
            --collect-all cn2an --collect-all certifi --collect-all httpcore --collect-all idna \
            --name backend main.py
          mkdir -p ../src-tauri/binaries
          cp dist/backend.exe ../src-tauri/binaries/backend-x86_64-pc-windows-msvc.exe

      # bundle.active=false → 只出裸二进制，不生成 NSIS/MSI 安装壳。
      # 运行时 Tauri 按 <exe同级>/backend.exe 定位 sidecar（见 tauri-plugin-shell
      # 的 relative_command_path），所以便携目录只需平铺两个 exe。
      - name: 构建便携版（不生成安装包）
        run: npx tauri build --config src-tauri/tauri.portable.json --target x86_64-pc-windows-msvc

      - name: 组装便携目录并打包 zip
        shell: pwsh
        run: |
          $rel = 'src-tauri\target\x86_64-pc-windows-msvc\release'
          $stage = 'TextForge'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel\textforge.exe" $stage
          Copy-Item "$rel\backend.exe" $stage
          Copy-Item 'docs\使用说明.txt' $stage
          $ver = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          $zip = "TextForge_${ver}_portable_x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "生成 $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          Get-FileHash $zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $zip" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: 上传便携包到 Release
        shell: pwsh
        # gh CLI 不会自动读取 Actions 内置凭据，缺 GH_TOKEN 会直接报
        # "To use GitHub CLI in a GitHub Actions workflow, set the GH_TOKEN
        # environment variable" 并 exit 1。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content 'src-tauri\tauri.conf.json' -Raw | ConvertFrom-Json).version
          # 用单引号 here-string：正文里有 markdown 反引号，在双引号 here-string
          # 里会被 PowerShell 当成转义符吃掉。版本号靠 -replace 事后替换。
          $notes = @'
          文炼工坊 TextForge __VER__ —— **免安装便携版**

          - 下载 `TextForge___VER___portable_x64.zip`，**解压**后双击 `textforge.exe`
          - 不需要安装、不需要管理员权限、不写注册表
          - 整个文件夹可随意搬移；删除文件夹即彻底卸载，不留残余
          - 用 SHA256SUMS.txt 校验下载完整性：`certutil -hashfile 文件名 SHA256`

          ## 为什么改用便携版
          之前的 NSIS 安装包会被 Windows Defender 误报拦截
          （`Trojan:Win32/Wacatac.B!ml`；末尾 `!ml` 表示机器学习泛化判定，不是病毒特征码）。
          实测把 PyInstaller 后端单独拿出来扫描是干净的，元凶是安装壳把这份
          高熵载荷又包了一层。便携版彻底去掉了安装壳。

          ## 关于「删掉文件夹是否等于没装过」
          实测：注册表、AppData、LocalAppData 均无新增项；历史/日志/端口文件
          全部落在包内 `data\` 子目录。唯一例外是运行期间 `%TEMP%` 下的
          `_MEIxxxxxx`（Python 自解压缓存，约 40MB），**正常关窗即自动删除**；
          仅在进程被强杀或系统断电时才会残留，Windows 会自行清理临时目录。

          ## 仍可能提示未知发布者
          本项目未购买商业代码签名证书，因此没有数字签名。
          若 Defender 仍误报，请在「病毒和威胁防护 → 保护历史记录」中恢复，
          并把解压后的文件夹加入排除项。

          ## 小说成品在哪
          不在本文件夹里 —— 成品路径由你在界面中自行选择。
          '@
          $notes = $notes -replace '__VER__', $ver
          $notes | Out-File -Encoding utf8 RELEASE_NOTES.md

          gh release create "${{ github.ref_name }}" `
            "TextForge_${ver}_portable_x64.zip" `
            "SHA256SUMS.txt" `
            --title "TextForge $ver（免安装便携版）" `
            --notes-file RELEASE_NOTES.md `
            --repo "${{ github.repository }}"