[package]
name = "textforge"
version = "0.9.1"
description = "文炼工坊 TextForge"
authors = ["Starlife-creator"]
edition = "2021"

[lib]
name = "textforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", features = ["rustls-tls", "json"], default-features = false }
# 只用到 tokio::time::sleep 与 tokio::task::spawn_blocking；"full" 会拉进
# net/process/fs/signal 等一堆用不上的模块，白白拖慢编译、增大体积。
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v4 UUID 作为本地 API 的调用方 token（CSPRNG，够长且无弱随机源依赖）
uuid = { version = "1", features = ["v4"] }

# 孤儿进程看门狗要用 OpenProcess 探测 PID 存活；不引整个 winapi，只取这两个模块。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# 非 Windows 下 backend.rs 用 libc::kill 探测/终止 PID。此前只在 cfg(not(windows))
# 分支里裸写 libc::kill 却没声明依赖，导致 macOS/Linux 根本编译不过。
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
